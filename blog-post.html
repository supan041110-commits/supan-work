<script>
(function(){
  var DATA = window.PORTFOLIO_POSTS && window.PORTFOLIO_POSTS.posts || [];
  var qs = new URLSearchParams(location.search);
  var id = qs.get('id');
  var post = null;
  for(var i=0;i<DATA.length;i++){ if(DATA[i].id===id){ post=DATA[i]; break; } }

  if(!post){
    document.getElementById('postTitle').textContent='文章未找到';
    document.getElementById('postContent').innerHTML='<p>没有找到这篇内容，可能已被删除或链接有误。<a href="blog.html" class="work-more">← 返回列表</a></p>';
    return;
  }

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function fmtDate(s){if(!s)return'';var p=s.split('-');return p[0]+'.'+p[1]+'.'+p[2];}

  document.title = post.title + ' | 盘一盘 · 苏攀 Pan Su';
  document.getElementById('postTitle').textContent = post.title;
  var badges = document.getElementById('postBadges');
  badges.innerHTML = '<span>'+esc(post.category||'博客')+'</span>' + (post.tags||[]).slice(0,3).map(function(t){return '<span>'+esc(t)+'</span>';}).join('');
  document.getElementById('postMeta').innerHTML =
    '<span><b>日期</b> '+fmtDate(post.date)+'</span>' +
    '<span><b>类别</b> '+esc(post.category||'博客')+'</span>';

  // 简单 Markdown 渲染
  function mdToHtml(md){
    var lines = (md||'').split('\n');
    var html = '', inList = false, toc = [];
    function closeList(){ if(inList){ html+='</ul>'; inList=false; } }
    lines.forEach(function(line){
      var t = line.trim();
      if(!t){ closeList(); return; }
      var h = t.match(/^(#{2,3})\s+(.*)$/);
      if(h){
        closeList();
        var lv = h[1].length;
        var text = h[2].replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
        var slug = text.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]+/g,'-');
        toc.push({lv:lv, text:h[2], slug:slug});
        html += '<h'+(lv+1)+' id="'+slug+'">'+text+'</h'+(lv+1)+'>';
        return;
      }
      var li = t.match(/^[-*]\s+(.*)$/);
      if(li){
        if(!inList){ html+='<ul>'; inList=true; }
        html += '<li>'+li[1].replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')+'</li>';
        return;
      }
      closeList();
      html += '<p>'+t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')+'</p>';
    });
    closeList();
    // 生成目录
    var tocHtml = '';
    toc.forEach(function(h){
      tocHtml += '<a href="#'+h.slug+'" style="'+(h.lv===2?'padding-left:10px;':'')+'">'+esc(h.text)+'</a>';
    });
    document.getElementById('postToc').innerHTML = toc.length? tocHtml : '<a href="#top">返回顶部 ↑</a>';
    return html;
  }
  document.getElementById('postContent').innerHTML = '<div class="post-article">' + mdToHtml(post.content) + '</div>';
  window.scrollTo({top:0});
})();
</script>
</body>
