<script>
(function(){
  var DATA = window.PORTFOLIO_POSTS && window.PORTFOLIO_POSTS.posts || [];
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function fmtDate(s){if(!s)return'';var p=s.split('-');return p[0]+'.'+p[1]+'.'+p[2];}

  // 类别标签
  var cats = ['全部'];
  DATA.forEach(function(p){ if(p.category && cats.indexOf(p.category)<0) cats.push(p.category); });
  var heroTags = document.getElementById('heroTags');
  var tags = {};
  DATA.forEach(function(p){ (p.tags||[]).forEach(function(t){ tags[t]=1; }); });
  var tagsArr = Object.keys(tags);
  if(heroTags){ heroTags.innerHTML = tagsArr.length? tagsArr.slice(0,6).map(function(t){return '<span>'+esc(t)+'</span>';}).join('') : '<span>持续观察中</span>'; }

  // 分类按钮
  var catsEl = document.getElementById('blogCats');
  catsEl.innerHTML = cats.map(function(c){return '<button class="bc'+(c==='全部'?' bc-on':'')+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>';}).join('');

  var grid = document.getElementById('blogGrid');
  function render(cat){
    var list = DATA.filter(function(p){ return cat==='全部' || p.category===cat; });
    if(!list.length){ grid.innerHTML='<div class="blog-empty">该分类还没有文章，敬请期待。</div>'; return; }
    list.sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
    grid.innerHTML = list.map(function(p,i){
      var tagHtml = (p.tags||[]).slice(0,3).map(function(t){return '<span>'+esc(t)+'</span>';}).join('');
      return '<a class="post reveal'+(i<4?' in':'')+'" href="blog-post.html?id='+esc(p.id)+'">'+
        '<div class="post-top"><span class="post-cat">'+esc(p.category||'博客')+'</span>'+
        '<span class="post-date">'+fmtDate(p.date)+'</span></div>'+
        '<h3>'+esc(p.title)+'</h3>'+
        '<p>'+esc(p.excerpt||'')+'</p>'+
        '<div class="post-tags">'+tagHtml+'</div>'+
        '<div class="post-more">阅读全文 →</div>'+
      '</a>';
    }).join('');
    // 触发 reveal
    document.querySelectorAll('#blogGrid .reveal').forEach(function(el,i){
      setTimeout(function(){el.classList.add('in');}, 40*i);
    });
  }
  render('全部');

  // 分类切换
  catsEl.addEventListener('click', function(e){
    var btn = e.target.closest('.bc'); if(!btn) return;
    catsEl.querySelectorAll('.bc').forEach(function(b){b.classList.remove('bc-on');});
    btn.classList.add('bc-on');
    render(btn.getAttribute('data-cat'));
  });

  // 年份/路径
  var updated = window.PORTFOLIO_POSTS && window.PORTFOLIO_POSTS.updated;
})();
</script>
